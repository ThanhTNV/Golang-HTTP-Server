apiVersion: v1
kind: Service
metadata:
  name: k8s-pod-daemonset-svc
  labels:
    app: k8s-pod-daemonset
spec:
  type: ClusterIP
  selector:
    app: k8s-pod-daemonset
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: k8s-pod-daemonset
  labels:
    app: k8s-pod-daemonset
spec:
  selector:
    matchLabels:
      app: k8s-pod-daemonset
  template:
    metadata:
      labels:
        app: k8s-pod-daemonset
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: k8s-pod
          image: daemonset-go:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              hostPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"