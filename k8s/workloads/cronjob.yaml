apiVersion: v1
kind: ServiceAccount
metadata:
  name: cronjob-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cronjob-endpoint-reader
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    resourceNames: ["k8s-pod-daemonset-svc"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cronjob-endpoint-reader-binding
subjects:
  - kind: ServiceAccount
    name: cronjob-sa
roleRef:
  kind: Role
  name: cronjob-endpoint-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k8s-pod-cronjob
  labels:
    app: k8s-pod-cronjob
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: k8s-pod-cronjob
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: k8s-pod-cronjob
        spec:
          serviceAccountName: cronjob-sa
          restartPolicy: Never
          volumes:
            - name: cronjob-storage
              persistentVolumeClaim:
                claimName: pvc-2gb
          containers:
            - name: k8s-pod
              image: cronjob-go:latest
              imagePullPolicy: Never
              volumeMounts:
                - name: cronjob-storage
                  mountPath: /data
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "200m"
                  memory: "256Mi"
